name: Chiritumo coupon transfer history release
on:
  push:
    branches: [main]
    paths: [docs/releases/chiritumo-history-20261030.md]
permissions:
  contents: read
concurrency:
  group: winning-url-vault-production
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      WRANGLER_SEND_METRICS: 'false'
      CLOUDFLARE_ACCOUNT_ID: 02100d2235d6f7d7f893b4217b58b902
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - name: Retain runtime settings and capture existing item identities
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          node scripts/release-chiritumo.mjs static-prepare
          node scripts/release-chiritumo-history.mjs prepare
      - name: Add history visibility metadata only
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          npx wrangler d1 execute winning-url-vault --remote --file=migrations/0014_chiritumo_history.sql
          node scripts/release-chiritumo-history.mjs record-migration
      - name: Publish history endpoints retaining production configuration
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler deploy --config .release-wrangler.json --keep-vars --message "Chiritumo history $GITHUB_SHA"
      - name: Verify history grouping, display deletion, URL preservation and test cleanup
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node scripts/release-chiritumo-history.mjs verify
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chiritumo-history-${{ github.run_id }}
          path: chiritumo-history-evidence.json
