name: Deploy Seven parser repair
on:
  push:
    branches: [main]
    paths: [".github/workflows/deploy-seven-parser.yml"]
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 02100d2235d6f7d7f893b4217b58b902
    steps:
      - uses: actions/checkout@v4
        with:
          repository: 45kikurage-rgb/coupon-analyzer-api
          ref: c5c12590dba39e72e517c2f91c7c6542c8eb476b
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: node --check src/index.js
      - run: npm test
      - run: npm run deploy
