name: Provisional controls production release
on:
  push:
    branches: [main]
    paths: [docs/releases/provisional-controls-20261026.md]
permissions:
  contents: read
  actions: read
concurrency:
  group: winning-url-vault-production
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      WRANGLER_SEND_METRICS: 'false'
      CLOUDFLARE_ACCOUNT_ID: 02100d2235d6f7d7f893b4217b58b902
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Require this exact main commit's existing CI success
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json,os,time,urllib.request
          url=f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/actions/workflows/ci.yml/runs?head_sha={os.environ['GITHUB_SHA']}"
          for attempt in range(36):
              req=urllib.request.Request(url,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
              runs=json.load(urllib.request.urlopen(req))['workflow_runs']
              candidates=[r for r in runs if r['head_sha']==os.environ['GITHUB_SHA'] and r['event']=='push']
              if candidates and candidates[0]['status']=='completed':
                  assert candidates[0]['conclusion']=='success','CI_FAILED'
                  print('Exact main SHA CI succeeded');break
              time.sleep(5)
          else:raise SystemExit('CI_TIMEOUT')
          PY
      - name: Verify mobile collapse and per-item deletion in Chromium
        run: |
          npm install --prefix "$RUNNER_TEMP/vault-ui-browser" --no-audit --no-fund --package-lock=false playwright@1.58.2
          node "$RUNNER_TEMP/vault-ui-browser/node_modules/playwright/cli.js" install --only-shell chromium
          NODE_PATH="$RUNNER_TEMP/vault-ui-browser/node_modules" node scripts/test-provisional-ui.cjs
      - name: Build exactly the reviewed Worker, without credentials
        run: npx wrangler deploy --dry-run --outdir release-bundle
      - name: Read-only production preflight
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          python3 scripts/release-provisional-controls.py preflight
      - name: Publish approved UI without legacy migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler deploy --config .release-wrangler.json --keep-vars --message "Provisional controls $GITHUB_SHA"
      - name: Verify exact production bytes and retained runtime configuration
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: python3 scripts/release-provisional-controls.py verify
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: provisional-controls-release-${{ github.run_id }}
          path: release-evidence.json
          if-no-files-found: warn
          retention-days: 14

