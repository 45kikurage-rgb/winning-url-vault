name: One-time provisional ACK production hotfix
on:
  push:
    branches: [main]
    paths:
      - src/provisional.js
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: winning-url-vault-provisional-ack-20261017
  cancel-in-progress: false
jobs:
  deploy:
    if: contains(github.event.head_commit.message, '[deploy-vault-ack-20261017]')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 02100d2235d6f7d7f893b4217b58b902
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - name: Confirm Cloudflare permissions
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || (echo 'Cloudflare credentials missing' && exit 1)
      - name: Read-only D1 version check
        run: |
          npx wrangler d1 info winning-url-vault
          npx wrangler d1 migrations list winning-url-vault --remote
      - name: Deploy code only without DB migrations
        run: npx wrangler deploy
      - name: Verify production site responds
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 3 --max-time 20 https://winning-url-vault.45kikurage.workers.dev/api/auth/status > "$RUNNER_TEMP/status.json"
          grep -q '"mode":"production"' "$RUNNER_TEMP/status.json"
