name: Verify sorting resume PWA production
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/sorting-resume-verify.yml
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Verify fresh production assets with retries
        run: |
          set -euo pipefail
          root="https://winning-url-vault.45kikurage.workers.dev"
          for i in 1 2 3 4 5; do
            echo "Check attempt $i"
            curl --silent --show-error --fail --max-time 20 -H 'Cache-Control: no-cache' "$root/?smoke=sorting-resume-20261017" -o /tmp/vault-index || true
            curl --silent --show-error --fail --max-time 20 -H 'Cache-Control: no-cache' "$root/network-read.js?smoke=sorting-resume-20261017" -o /tmp/vault-net || true
            curl --silent --show-error --fail --max-time 20 "$root/api/auth/status" -o /tmp/vault-auth || true
            echo "HTML bytes: $(wc -c </tmp/vault-index 2>/dev/null || echo 0)"
            echo "JS bytes: $(wc -c </tmp/vault-net 2>/dev/null || echo 0)"
            echo "HTML marker status: $(grep -c 'sortingLoadStatus' /tmp/vault-index || true)"
            echo "JS marker status: $(grep -c 'fetchReadWithRetry' /tmp/vault-net || true)"
            echo "Auth status has production: $(grep -c '"mode":"production"' /tmp/vault-auth || true)"
            if grep -q 'sortingLoadStatus' /tmp/vault-index && grep -q 'fetchReadWithRetry' /tmp/vault-net && grep -q '"mode":"production"' /tmp/vault-auth; then
              echo 'Published PWA, safe-read module, production auth: verified'
              exit 0
            fi
            sleep 5
          done
          echo "Frontend deployment did not pass remote checks"
          exit 1
