name: Aru-Success production verification
on:
  push:
    branches: [main]
    paths: [.github/workflows/aru-success-release.yml]
permissions:
  contents: read
concurrency:
  group: winning-url-vault-production
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify active release after Cloudflare propagation
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: python3 scripts/release-aru-success.py
