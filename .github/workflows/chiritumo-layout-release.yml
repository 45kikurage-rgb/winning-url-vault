name: Chiritumo five-tab phone layout release
on:
  push:
    branches: [main]
    paths: [docs/releases/chiritumo-layout-20261030.md]
permissions:
  contents: read
concurrency:
  group: winning-url-vault-production
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      WRANGLER_SEND_METRICS: 'false'
      CLOUDFLARE_ACCOUNT_ID: 02100d2235d6f7d7f893b4217b58b902
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Preserve production configuration for layout-only publication
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node scripts/release-chiritumo.mjs static-prepare
      - name: Publish five-tab layout without database changes
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler deploy --config .release-wrangler.json --keep-vars --message "Chiritumo phone tabs $GITHUB_SHA"
      - name: Verify public assets and retained runtime
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node scripts/release-chiritumo.mjs static-verify
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chiritumo-layout-${{ github.run_id }}
          path: chiritumo-release-evidence.json
