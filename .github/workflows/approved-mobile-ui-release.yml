name: Approved mobile UI production release
on:
  push:
    branches: [main]
    paths: [docs/releases/approved-mobile-ui-20261025.md]
permissions:
  contents: read
  actions: read
concurrency:
  group: winning-url-vault-production
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      WRANGLER_SEND_METRICS: 'false'
      CLOUDFLARE_ACCOUNT_ID: 02100d2235d6f7d7f893b4217b58b902
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Require this exact main commit's existing CI success
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json,os,time,urllib.request
          url=f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/actions/workflows/ci.yml/runs?head_sha={os.environ['GITHUB_SHA']}"
          for attempt in range(36):
              req=urllib.request.Request(url,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
              runs=json.load(urllib.request.urlopen(req))['workflow_runs']
              candidates=[r for r in runs if r['head_sha']==os.environ['GITHUB_SHA'] and r['event']=='push']
              if candidates and candidates[0]['status']=='completed':
                  assert candidates[0]['conclusion']=='success','CI_FAILED'
                  print('Exact main SHA CI succeeded');break
              time.sleep(5)
          else:raise SystemExit('CI_TIMEOUT')
          PY
      - run: python3 scripts/test-release-approved-ui.py
      - name: Build exactly the reviewed Worker, without credentials
        run: npx wrangler deploy --dry-run --outdir release-bundle
      - name: Preflight existing deployment and prepare isolated UI table
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          python3 scripts/release-approved-ui.py preflight
          python3 scripts/release-approved-ui.py add-table
      - name: Publish approved UI without legacy migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler deploy --config .release-wrangler.json --keep-vars --message "Approved mobile UI $GITHUB_SHA"
      - name: Verify exact production bytes and retained runtime configuration
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: python3 scripts/release-approved-ui.py verify
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: approved-ui-release-${{ github.run_id }}
          path: release-evidence.json
          if-no-files-found: warn
          retention-days: 14
