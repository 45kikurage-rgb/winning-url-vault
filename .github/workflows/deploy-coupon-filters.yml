name: Deploy coupon result filters
on:
  push:
    branches: [main]
    paths: [".github/workflows/deploy-coupon-filters.yml"]
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 02100d2235d6f7d7f893b4217b58b902
    steps:
      - uses: actions/checkout@v4
        with:
          repository: 45kikurage-rgb/coupon-analyzer
          ref: 15f3b64cd4bebdccf8492102c1b5910cbe6a8337
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: node --check public/analyzer.js && node --check public/sw.js
      - run: npm test
      - run: npm run deploy
