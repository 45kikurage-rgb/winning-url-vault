name: Deploy Ticket campaign management
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/ticket-campaign-publish.yml']
permissions:
  contents: read
concurrency:
  group: winning-url-vault-deploy
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 02100d2235d6f7d7f893b4217b58b902
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - name: Check that the installed app and cache use the same styles
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import {readFileSync} from 'node:fs';
          const url=readFileSync('public/index.html','utf8').match(/href="(\/styles\.css\?v=[^"]+)"/)?.[1];
          assert(url && readFileSync('public/sw.js','utf8').includes(JSON.stringify(url)));
          JS
      - name: Deploy the Worker using the existing storage
        run: npx wrangler deploy