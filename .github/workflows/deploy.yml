name: Deploy
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - docs/releases/winning-campaign-reassignment-20261022.md
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 02100d2235d6f7d7f893b4217b58b902
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - name: Verify Cloudflare credentials
        run: test -n "$CLOUDFLARE_API_TOKEN" || (echo "CLOUDFLARE_API_TOKEN repository secret is required" && exit 1)
      - name: One-time release D1 preflight (read-only)
        if: github.event_name == 'push'
        run: |
          npx wrangler d1 info winning-url-vault
          npx wrangler d1 time-travel info winning-url-vault
          npx wrangler d1 execute winning-url-vault --remote --command "SELECT COUNT(*) AS active_items FROM items WHERE status='active';"
      - name: Apply additive one-device authentication migration (push release only)
        if: github.event_name == 'push'
        run: npx wrangler d1 migrations apply winning-url-vault --remote
      - name: Release Worker without repeating any migrations
        if: github.event_name == 'push'
        run: npx wrangler deploy
      - name: Manual deployment (legacy migration workflow)
        if: github.event_name == 'workflow_dispatch'
        run: npm run deploy
