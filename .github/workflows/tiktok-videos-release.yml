name: TikTok video collection production release
on:
  push:
    branches: [main]
    paths: [docs/releases/tiktok-videos-20261028.md]
permissions:
  contents: write
  actions: read
concurrency:
  group: winning-url-vault-production
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      WRANGLER_SEND_METRICS: 'false'
      CLOUDFLARE_ACCOUNT_ID: 02100d2235d6f7d7f893b4217b58b902
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Require successful CI for the exact reviewed main commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json,os,time,urllib.request
          url=f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/actions/workflows/ci.yml/runs?head_sha={os.environ['GITHUB_SHA']}"
          for _ in range(100):
              req=urllib.request.Request(url,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
              runs=json.load(urllib.request.urlopen(req))['workflow_runs']
              candidates=[r for r in runs if r['head_sha']==os.environ['GITHUB_SHA'] and r['event']=='push']
              if candidates and candidates[0]['status']=='completed':
                  assert candidates[0]['conclusion']=='success','CI_FAILED'
                  print('Exact main SHA CI succeeded');break
              time.sleep(5)
          else:raise SystemExit('CI_TIMEOUT')
          PY
      - name: Verify phone-sized collection and clipboard flow in Chromium
        run: |
          npm install --prefix "$RUNNER_TEMP/vault-ui-browser" --no-audit --no-fund --package-lock=false playwright@1.58.2
          node "$RUNNER_TEMP/vault-ui-browser/node_modules/playwright/cli.js" install --only-shell chromium
          NODE_PATH="$RUNNER_TEMP/vault-ui-browser/node_modules" node scripts/check-tiktok-videos-ui.cjs
      - name: Build reviewed Worker without credentials
        run: npx wrangler deploy --dry-run --outdir release-bundle
      - name: Export and restore database, encrypt and persist recovery backup
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release-tiktok-videos.mjs prepare
      - name: Add isolated video tables only, retaining all existing schemas
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node scripts/release-tiktok-videos.mjs add-tables
      - name: Publish to existing site with retained configuration
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler deploy --config .release-wrangler.json --keep-vars --message "TikTok videos $GITHUB_SHA"
      - name: Verify served bytes, guards and recover previously received video URLs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node scripts/release-tiktok-videos.mjs verify
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tiktok-videos-release-${{ github.run_id }}
          path: tiktok-release-evidence.json
          if-no-files-found: warn
          retention-days: 14
