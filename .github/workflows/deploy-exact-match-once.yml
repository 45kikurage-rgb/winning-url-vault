name: Deploy exact-match fix
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/deploy-exact-match-once.yml"
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 02100d2235d6f7d7f893b4217b58b902
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - name: Verify Cloudflare credentials
        run: test -n "$CLOUDFLARE_API_TOKEN"
      - run: npm run deploy
