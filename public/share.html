<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#020711">
  <meta name="mobile-web-app-capable" content="yes">
  <title>当選URL受信</title>
  <link rel="manifest" href="/manifest.json">
  <link rel="apple-touch-icon" href="/icon-any-192.png">
  <link rel="stylesheet" href="/styles.css">
</head>
<body class="share-page">
  <main class="share-shell">
    <section class="share-card">
      <img class="share-icon" src="/icon-any-512.png" alt="">
      <p class="share-kicker">WINNING URL VAULT</p>
      <h1>当選URL受信</h1>
      <div id="shareState" class="share-state" aria-live="polite">共有データを確認しています…</div>
      <div id="shareCount" class="share-count"></div>
      <pre id="shareValues" class="share-values hidden"></pre>
      <p id="shareMessage" class="share-message"></p>
      <a id="shareOpen" class="share-button hidden" href="/">管理画面を開く</a>
      <button id="shareRetry" class="hidden" type="button">もう一度送信</button>
      <p class="share-note">送信完了後はAndroidの「戻る」で共有元へ戻れます。</p>
    </section>
  </main>
  <script src="/share.js"></script>
</body>
</html>
